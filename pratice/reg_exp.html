<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use of regular expression in javascript</title>
</head>
<body>
    <script>
        let str="this world is so cruel for innnocent people";
        let regexp=/"innocent"/;
        if(regexp.test(str)){
            document.write("Match found")
        }
        else{
            document.write("Match not found")
        }
    </script>
</body>
</html>
